# Dev-mode OpenBao (in-memory, root token "root"). values.yaml is the upstream
# install/k3d/common/values-openbao.yaml; its postStart hook configures k8s auth,
# the reader/writer policies, and seeds the placeholder secrets every plane reads.
# Because storage is in-memory, a pod restart re-runs postStart and re-seeds.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: 0.25.6
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
