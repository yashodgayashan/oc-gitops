apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: openchoreo-control-plane
spec:
  interval: 30m
  chart:
    spec:
      chart: kgateway-crds
      version: v2.3.1
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: openchoreo-control-plane
spec:
  interval: 30m
  dependsOn:
    - name: kgateway-crds
  chart:
    spec:
      chart: kgateway
      version: v2.3.1
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
