# Not part of the upstream install. Replaces the manual "copy cluster-gateway CA
# into each plane namespace" kubectl step with a Bundle (see
# openchoreo/control-plane/cluster-gateway-ca-bundle.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: trust-manager
      version: v0.25.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    app:
      trust:
        # Bundle sources are read from this namespace only; the cluster-gateway
        # CA secret lives in the control-plane namespace.
        namespace: openchoreo-control-plane
