# ThunderID identity provider. Values (bootstrap users, groups, OAuth clients and
# their redirect URLs) come from the cluster overlay (clusters/<env>/overlays/thunder).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thunder
  namespace: thunder
spec:
  interval: 30m
  chart:
    spec:
      chart: thunderid
      version: 1.0.1
      sourceRef:
        kind: HelmRepository
        name: thunder-id
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: thunder-values
