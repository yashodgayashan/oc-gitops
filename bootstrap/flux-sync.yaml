# Points Flux at this repo. bootstrap.sh substitutes ${GIT_URL}, ${GIT_BRANCH} and
# ${CLUSTER} (k3d or kubernetes: which clusters/<dir> this cluster syncs).
# For a private repo add `secretRef: {name: oc-gitops-auth}` and create that
# secret with `flux create secret git oc-gitops-auth ...`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: oc-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: ${GIT_URL}
  ref:
    branch: ${GIT_BRANCH}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oc-gitops
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/${CLUSTER}
  prune: true
  sourceRef:
    kind: GitRepository
    name: oc-gitops
