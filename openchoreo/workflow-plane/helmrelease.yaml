apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: openchoreo-workflow-plane
spec:
  interval: 30m
  chart:
    spec:
      chart: docker-registry
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: twuni
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Upstream install/k3d/single-cluster/values-registry.yaml.
  valuesFrom:
    - kind: ConfigMap
      name: registry-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-workflow-plane
  namespace: openchoreo-workflow-plane
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: registry
  chart:
    spec:
      chart: openchoreo-workflow-plane
      version: 1.3.1
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # Upstream install/k3d/single-cluster/values-wp.yaml.
  valuesFrom:
    - kind: ConfigMap
      name: workflow-plane-values
