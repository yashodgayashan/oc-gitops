apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-workflow-plane
  namespace: openchoreo-workflow-plane
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: openchoreo-workflow-plane
      version: 1.3.1
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # Values come from the cluster overlay (clusters/<env>/overlays/workflow-plane).
  valuesFrom:
    - kind: ConfigMap
      name: workflow-plane-values
