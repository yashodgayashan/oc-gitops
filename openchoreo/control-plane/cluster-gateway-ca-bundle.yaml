# Publishes the public cluster-gateway CA (issued by the control-plane chart) as
# ConfigMap "cluster-gateway-ca" (key ca.crt) into every namespace labelled
# oc-gitops/cluster-gateway-ca=true, which is what each plane's cluster-agent
# mounts to verify the gateway. Replaces the manual copy step in the install docs.
# The control-plane namespace is deliberately not labelled: the chart owns a
# placeholder ConfigMap of the same name there, and its own pods mount the Secret.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cluster-gateway-ca
spec:
  sources:
    - secret:
        name: cluster-gateway-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        oc-gitops/cluster-gateway-ca: "true"
