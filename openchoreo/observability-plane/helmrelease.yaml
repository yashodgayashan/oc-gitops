apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-observability-plane
  namespace: openchoreo-observability-plane
spec:
  interval: 30m
  timeout: 25m
  chart:
    spec:
      chart: openchoreo-observability-plane
      version: 1.3.1
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # Upstream install/k3d/single-cluster/values-op.yaml.
  valuesFrom:
    - kind: ConfigMap
      name: observability-plane-values
  values:
    observer:
      audit:
        enabled: true
