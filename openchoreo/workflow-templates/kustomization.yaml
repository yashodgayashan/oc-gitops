# Argo ClusterWorkflowTemplates from upstream samples/getting-started @ v1.3.1.
# Separate module because the ClusterWorkflowTemplate CRD is installed by the
# workflow-plane HelmRelease, so it must exist before these can be applied.
# Swap checkout-source / publish-image-k3d for your own git auth or registry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - checkout-source.yaml
  - build-templates.yaml
  - publish-image-k3d.yaml
  - generate-workload-k3d.yaml
