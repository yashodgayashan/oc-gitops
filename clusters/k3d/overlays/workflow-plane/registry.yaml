# In-cluster registry the k3d build templates push to (host.k3d.internal:10082).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: openchoreo-workflow-plane
spec:
  interval: 30m
  chart:
    spec:
      chart: docker-registry
      version: 3.0.0
      sourceRef:
        kind: HelmRepository
        name: twuni
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Upstream install/k3d/single-cluster/values-registry.yaml.
  valuesFrom:
    - kind: ConfigMap
      name: registry-values
