# OpenChoreo planes, their registrations, and default platform resources.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: control-plane
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: trust-manager
    - name: kgateway
    - name: openbao
    - name: thunder
    - name: coredns
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./clusters/k3d/overlays/control-plane
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: oc-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: default-resources
  namespace: flux-system
spec:
  dependsOn:
    - name: control-plane
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./openchoreo/default-resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: oc-gitops
---
