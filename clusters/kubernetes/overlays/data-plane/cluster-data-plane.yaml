# Registers the data plane with the control plane. clientCA points at the agent's
# cert Secret instead of inlining the PEM, so nothing has to be copied by hand.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterDataPlane
metadata:
  name: default
spec:
  planeID: default
  clusterAgent:
    clientCA:
      secretKeyRef:
        name: cluster-agent-tls
        namespace: openchoreo-data-plane
        key: ca.crt
  secretStoreRef:
    name: default
  observabilityPlaneRef:
    kind: ClusterObservabilityPlane
    name: default
  gateway:
    ingress:
      external:
        http:
          host: ${DP_DOMAIN}
          listenerName: http
          port: 80
        https:
          host: ${DP_DOMAIN}
          listenerName: https
          port: 443
        name: gateway-default
        namespace: openchoreo-data-plane
